# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
databases:
  - name: banca-inteligente-db
    databaseName: collections
    user: app
    plan: free
    region: oregon

envVarGroups:
  - name: banca-inteligente-shared
    envVars:
      - key: FAKE_DATA_ONLY
        value: "true"

services:
  - type: web
    name: banca-inteligente-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: /bin/sh -c 'set -e; export PUBLIC_BASE_URL="${PUBLIC_BASE_URL:-$RENDER_EXTERNAL_URL}"; alembic upgrade head; exec uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}'
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - backend/**
    envVars:
      - fromGroup: banca-inteligente-shared
      - key: DATABASE_URL
        fromDatabase:
          name: banca-inteligente-db
          property: connectionString
      - key: APP_SECRET
        generateValue: true
      - key: RETELL_API_KEY
        sync: false
      - key: RETELL_AGENT_ID
        sync: false
      - key: RETELL_AGENT_VERSION
        value: "1"
      - key: RETELL_REQUIRE_SIGNATURE
        value: "true"
      - key: RUN_WORKER_IN_WEB
        value: "true"
      - key: RETELL_FROM_NUMBER
        sync: false
      - key: RETELL_ALLOWED_TEST_NUMBERS
        sync: false

  - type: web
    name: banca-inteligente-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - frontend/**
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
